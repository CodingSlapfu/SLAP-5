name: SLAP-5 environment recovery
on:
  push:
    branches: [slap-5-environment-recovery]
    paths: [.github/workflows/environment-recovery.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d68d757a39acb71f3d73fe491f86f33b6a653ac
      - name: Host baseline and regression fixtures
        run: |
          python3 -m venv "$RUNNER_TEMP/slap-python"
          source "$RUNNER_TEMP/slap-python/bin/activate"
          pip install Pillow==11.3.0 fonttools==4.59.2
          python3 vendor/fm1-base/tools/build.py device --host
          host="$PWD/device/build/host/slap-5_host"
          for fixture in device/tests/*.txt; do
            output="$(mktemp -d)"
            "$host" "$fixture" "$output"
          done
          python3 device/tests/midi-clock-stress.py "$host"
      - name: Recover pinned native toolchain and SDK
        if: always()
        run: |
          bash vendor/fm1-base/tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          toolchain="$(realpath "$RUNNER_TEMP/jieli/toolchain")"
          test "$(basename "$toolchain")" = jieli-linux-toolchains-20260730.1
          SDK_URL=https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git bash vendor/fm1-base/bsp/tools/get_sdk.sh "$RUNNER_TEMP/ac79"
          printf 'JIELI_TOOLCHAIN=%s\nAC79_SDK=%s\n' "$toolchain" "$RUNNER_TEMP/ac79" >> "$GITHUB_ENV"
      - name: Build v0.1.36 with verified native inputs
        run: |
          source "$RUNNER_TEMP/slap-python/bin/activate"
          sh device/build-native.sh --release 0.1.36
          cd device/build
          echo '1b8f1edc80ad3ea092f7ef8c10dc6637a9e90566015155874f54618f61ad3b70  slap-5-0.1.36.fwsc' | sha256sum -c -
          sha256sum slap-5-0.1.36.fwsc slap-5.bin loader/ota.bin > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: slap-5-0.1.36-verified-baseline
          retention-days: 30
          if-no-files-found: error
          path: |
            device/build/slap-5-0.1.36.fwsc
            device/build/slap-5.bin
            device/build/loader/ota.bin
            device/build/SHA256SUMS
