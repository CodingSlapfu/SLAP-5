name: Publish isolated v0.1.53 hardware test installer
on:
  push:
    branches: [slap-5-environment-recovery]
    paths: ['.github/workflows/install-test-0153.yml']
permissions:
  actions: read
  contents: write
  pages: write
concurrency: slap5-install-test-0153
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: cbde9b426af24a2ebec35f02516354c32cde2ff8
    steps:
      - uses: actions/checkout@v4
      - name: Require matching native, LCD regression, and site staging checks
        run: |
          for workflow in qualification-0153.yml stage-site-0153.yml; do
            sha="$GITHUB_SHA"
            if [ "$workflow" = home-lcd-verification.yml ]; then sha="$SOURCE"; fi
            state=''
            for attempt in $(seq 1 48); do
              run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$sha" --jq '.workflow_runs[0].id // empty')"
              if [ -n "$run" ]; then
                state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.status + ":" + (.conclusion // "")')"
                case "$state" in
                  completed:success) break ;;
                  completed:*) echo "$workflow $state"; exit 1 ;;
                esac
              fi
              sleep 8
            done
            test "$state" = completed:success
            if [ "$workflow" = stage-site-0153.yml ]; then
              gh run download "$run" --name SLAP-5-v0.1.53-current-only-site-unpublished --dir "$RUNNER_TEMP/testing-site"
            fi
            if [ "$workflow" = qualification-0153.yml ]; then
              gh run download "$run" --name SLAP-5-0.1.53-engineering-checkpoint-unpublished --dir "$RUNNER_TEMP/verified"
            fi
          done
          (cd "$RUNNER_TEMP/verified" && sha256sum -c SHA256SUMS-0.1.53)
      - name: Stage and validate the separate browser installer
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/pages" FETCH_HEAD
          cd "$RUNNER_TEMP/pages"
          cp "$RUNNER_TEMP/verified/SLAP-5-0.1.53.fwsc" "$RUNNER_TEMP/verified/SHA256SUMS-0.1.53" .
          sed 's/release-testing-0.1.52.json/release-testing-0.1.53.json/' flash-0.1.52.js > flash-0.1.53.js
          cat > flash-testing-0.1.53.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SLAP FLASH · Experimental Hardware Testing</title>
            <link rel="stylesheet" href="nexus-0.1.31/studio.css">
            <style>
              .flash-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1rem 0; }
              .flash-panel { padding: 1.25rem; margin-block: 1.25rem; }
              .flash-panel ol { padding-left: 1.5rem; }
              .flash-panel li { margin-bottom: .85rem; }
              .flash-panel code { overflow-wrap: anywhere; }
              .flash-panel summary { cursor: pointer; }
            </style>
            <link rel="stylesheet" href="nexus-0.1.31/fonts/slap-block.css">
          </head>
          <body data-experimental="true">
            <header><a class="brand" href="./">SLAP<span> FLASH</span></a><a href="testing-0.1.53/studio.html">SLAP STUDIO</a></header>
            <main>
              <h1>SLAP-5 v0.1.53 — EXPERIMENTAL FM-1 HARDWARE TESTING</h1>
              <p class="intro">FM-1_75000153. Native build, package checks and simulated updates and recovery passed. Physical audio timing, graph visibility and native LCD readability remain under test.</p>
              <p><a href="https://github.com/CodingSlapfu/SLAP-5/blob/slap-5-environment-recovery/evidence/qualification-0.1.53.md">On-device test checklist</a> · <a href="flash-testing-0.1.31.html">Previous v0.1.31 installer</a> · <a href="flash.html">Primary installer</a></p>
              <section class="editor copy flash-panel" aria-labelledby="browser-title">
                <p>Before testing, back up your song banks. Use a disposable project. V12 saves with active performance filters may be unreadable on earlier firmware. Keep a backup made before updating.</p>
                <h2 id="browser-title">Install directly from this website</h2>
                <p class="intro" id="availability">Loading the approved browser package…</p>
                <p>Use Chrome or Edge with USB MIDI SysEx. Connect one FM-1 directly by USB and close other MIDI apps. This experimental browser route accepts SLAP-5 v0.1.31 and v0.1.37–v0.1.52 on compatible hardware, with no sequential updates.</p>
                <p>This package requires a 1 MiB <code>0x856014</code> flash chip, chip key <code>0x980F</code> and a compatible V15-style bootloader layout. The website reads the firmware identity. Confirm the hardware and layout from a known device record or the read-only inspection in M-Flasher if you’re unsure.</p>
                <div class="flash-actions">
                  <button id="connect">Connect FM-1</button>
                  <button id="install" disabled>Install SLAP-5</button>
                </div>
                <label><input id="confirmed" type="checkbox" disabled> I confirmed the flash chip, chip key and bootloader layout and have a recovery route.</label>
                <p id="result" role="status" aria-live="polite"></p>
                <a id="desktop-fallback" href="#m-flasher">Use M-Flasher for unsupported configurations or recovery</a>
              </section>
              <section class="editor copy flash-panel" id="m-flasher" tabindex="-1" aria-labelledby="desktop-title">
                <h2 id="desktop-title">Install with M-Flasher</h2>
                <p>Use this alternative when browser OTA is unsupported or you need recovery. Once the unit is in USB download mode, this workflow works independently of the running firmware. AQUORA, SLOOP, Felucca, factory firmware and SLAP-5 can all use this route.</p>
                <div class="flash-actions">
                  <a class="primary" href="SLAP-5-0.1.53.fwsc">Download SLAP-5 v0.1.53 experimental</a>
                  <a class="primary" href="https://github.com/jvitkauskas/m-flasher/releases/latest">Get the latest M-Flasher</a>
                </div>
                <ol>
                  <li>Open the official M-Flasher release and select the download for Windows, macOS or Linux. If you already have M-Flasher, compare your version with the release heading. If you can’t find your version, get a fresh copy from the release page and open it yourself.</li>
                  <li>Connect the FM-1 directly with a USB data cable. Close browser MIDI tools and other music apps. Open M-Flasher and choose <strong>Download Mode</strong> if offered. With m-bootloader, hold <strong>REC</strong> at power-on. For other configurations, follow the <a href="https://github.com/jvitkauskas/m-flasher/blob/main/docs/usage.md#download-mode">M-Flasher download-mode guide</a>. Cancel any disk-format prompt.</li>
                  <li>Once M-Flasher reads the device, inspect <strong>Device info</strong>. This build targets the M-VAVE FM-1 with a 1 MiB <code>0x856014</code> flash chip, chip key <code>0x980F</code> and a compatible V15-style application layout. The <code>0xB36014</code> flash revision and unverified bootloader layouts are outside this build’s support. If any value or layout is unclear, stop at the read-only screen.</li>
                  <li>Choose <strong>Install firmware (.fwsc)</strong> and open <code>SLAP-5-0.1.53.fwsc</code>. Review the flash map before confirming. The write plan must stay in <code>0x4000–0x92FFF</code> and preserve the boot area and user-data regions. Decline any separate bootloader installation offer. Stop if the plan or M-Flasher reports a compatibility warning you can’t resolve.</li>
                  <li>Let M-Flasher save its automatic backup, complete the write and verify it. Keep the cable connected during the operation. After verification, restart and confirm SLAP-5 boots. Use browser detection below to check for <code>FM-1_75000153</code>.</li>
                </ol>
                <details><summary>Package checksum and recovery</summary>
                  <p>Compare the downloaded firmware SHA-256 with <a href="SHA256SUMS-0.1.53">the published checksums</a>.</p>
                  <p><a href="SLAP-5-0.1.24.fwsc">Download owner-tested 0.1.24</a> for rollback on compatible hardware.</p>
                  <p><a href="SLAP-5-0.1.25.fwsc">Download owner-tested 0.1.25</a> for rollback on compatible hardware.</p>
                  <p>For rollback, use M-Flasher with your pre-update backup or the verified <a href="SLAP-5-0.1.31.fwsc">v0.1.31 firmware</a> on compatible hardware. Keep the installed bootloader and song data when restoring.</p>
                  <p><a href="https://github.com/CodingSlapfu/SLAP-5/releases/tag/v0.1.22-hardware-testing">Previous 0.1.22 experimental release</a> ·
                    <a href="https://github.com/CodingSlapfu/SLAP-5/releases/tag/v0.1.20-diagnostic">0.1.20 Diagnostic</a> ·
                    <a href="flash.html#m-flasher">0.1.18 and legacy recovery</a></p>
                </details>
              </section>
            </main>
            <script type="module" src="flash-0.1.53.js"></script>
          </body>
          </html>
          HTML
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          package = Path("SLAP-5-0.1.53.fwsc").read_bytes()
          manifest = dict(version="0.1.53", product="FM-1_75000153", bytes=len(package),
                          sha256=hashlib.sha256(package).hexdigest(), sources=["FM-1_75000131","FM-1_75000137","FM-1_75000138","FM-1_75000139","FM-1_75000140","FM-1_75000141","FM-1_75000142","FM-1_75000143","FM-1_75000144","FM-1_75000145","FM-1_75000146","FM-1_75000147","FM-1_75000148","FM-1_75000149","FM-1_75000150","FM-1_75000151", "FM-1_75000152"])
          Path("release-testing-0.1.53.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {validateRelease, verifyPackage} from './flash-release.mjs';
          const release = validateRelease(JSON.parse(fs.readFileSync('release-testing-0.1.53.json')));
          await verifyPackage(release, fs.readFileSync(release.file));
          JS
          cp -a "$RUNNER_TEMP/testing-site" testing-0.1.53
          python3 - <<'PY'
          from pathlib import Path
          page = Path("index.html")
          site = page.read_text()
          section = '<section id="v0153"><h2>SLAP-5 v0.1.53 hardware testing</h2><p>Experimental FM-1 build. Physical qualification is pending.</p><p><a href="flash-testing-0.1.53.html">Direct browser installer</a> · <a href="testing-0.1.53/">Redesigned knobs and actual firmware screenshots</a> · <a href="testing-0.1.53/studio.html">Matching Studio</a></p><img width="240" height="240" loading="lazy" src="testing-0.1.53/screens/looper-jungle-240.png" alt="v0.1.53 HOME framebuffer"></section>'
          assert "</main>" in site
          page.write_text(site.replace("</main>", section + "\\n  </main>"))
          PY
          git add index.html testing-0.1.53 flash-testing-0.1.53.html flash-0.1.53.js release-testing-0.1.53.json SLAP-5-0.1.53.fwsc SHA256SUMS-0.1.53
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m 'Add isolated v0.1.53 hardware-testing installer'
          git push origin HEAD:refs/heads/gh-pages
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo 'Waiting for Pages deployment'
      - name: Verify exact files served by Pages
        run: |
          cd "$RUNNER_TEMP/pages"
          base=https://codingslapfu.github.io/SLAP-5
          for attempt in $(seq 1 30); do
            if curl -fsSL --max-time 15 "$base/flash-testing-0.1.53.html?verify=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/live" &&
               cmp flash-testing-0.1.53.html "$RUNNER_TEMP/live"; then break; fi
            sleep 8
          done
          for file in flash-testing-0.1.53.html flash-0.1.53.js release-testing-0.1.53.json SLAP-5-0.1.53.fwsc flash.html index.html testing-0.1.53/index.html testing-0.1.53/studio.html testing-0.1.53/emulator/app.wasm testing-0.1.53/screens/looper-jungle-240.png; do
            curl -fsSL --max-time 15 "$base/$file?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live"
            cmp "$file" "$RUNNER_TEMP/live"
          done

