name: SLAP-5 v0.1.39 hardware testing
on:
  push:
    branches: [slap-5-environment-recovery]
    paths: ['.github/workflows/hardware-testing-0139.yml']
permissions:
  actions: read
  contents: write
  pages: write
concurrency:
  group: slap-5-0.1.39-hardware-testing
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.39-hardware-testing
      CHECKPOINT: f948fa24b6547533be9e9465e4b7224136984405
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f948fa24b6547533be9e9465e4b7224136984405
      - name: Require exact-source host, browser and 155 BPM comparisons
        run: |
          test "$(git rev-parse HEAD)" = "$CHECKPOINT"
          for run in 45840093678 45840093704 45840093665; do
            for attempt in $(seq 1 30); do
              state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.head_sha + ":" + .status + ":" + (.conclusion // "")')"
              case "$state" in
                "$CHECKPOINT:completed:success") break ;;
                "$CHECKPOINT:completed:"*) exit 1 ;;
                "$CHECKPOINT:"*) sleep 8 ;;
                *) exit 1 ;;
              esac
            done
            test "$state" = "$CHECKPOINT:completed:success"
          done
      - name: Build and audit the versioned native package
        run: |
          python3 -m venv "$RUNNER_TEMP/slap-python"
          source "$RUNNER_TEMP/slap-python/bin/activate"
          pip install Pillow==11.3.0 fonttools==4.59.2
          bash vendor/fm1-base/tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          export JIELI_TOOLCHAIN="$(realpath "$RUNNER_TEMP/jieli/toolchain")"
          test "$(basename "$JIELI_TOOLCHAIN")" = jieli-linux-toolchains-20260730.1
          # This candidate uses neither the vendor BLE nor Wi-Fi stack.
          grep -qx 'ble = false' device/fm1.toml
          ! grep -Eq '^wifi[[:space:]]*=[[:space:]]*true' device/fm1.toml
          export AC79_SDK="$RUNNER_TEMP/ac79-packaging"
          tools_dir="$AC79_SDK/cpu/wl82/tools"
          sdk_raw=https://raw.githubusercontent.com/amitv87/fw-AC79_AIoT_SDK/d179b4484759423312073f5fbb232501aa491047/cpu/wl82/tools
          while read -r digest file; do
            mkdir -p "$(dirname "$tools_dir/$file")"
            curl -fsSL --retry 2 --max-time 30 "$sdk_raw/$file" -o "$tools_dir/$file"
            printf '%s  %s\n' "$digest" "$tools_dir/$file" | sha256sum -c -
          done < evidence/sdk.sha256
          sh device/build-native.sh --release 0.1.39
          pkg=device/build/slap-5-0.1.39.fwsc
          python3 tools/audit-package.py --sdk "$AC79_SDK" --app device/build/slap-5.bin \
            --loader device/build/loader/ota.bin --package "$pkg" --identity FM-1_75000139
          rollback="$RUNNER_TEMP/SLAP-5-0.1.31.fwsc"
          curl -fsSL --retry 3 -o "$rollback" https://github.com/CodingSlapfu/SLAP-5/releases/download/v0.1.31-hardware-testing/SLAP-5-0.1.31.fwsc
          printf '%s  %s\n' 36676ae153435f065c99c2106bdccf43917f7cd57f65fb702e0144d0055ef8be "$rollback" | sha256sum -c -
          cc -O2 -o "$RUNNER_TEMP/ldr-test" vendor/fm1-base/tests/ldr_test.c
          "$RUNNER_TEMP/ldr-test" "$rollback" "$pkg" --interrupt
          "$RUNNER_TEMP/ldr-test" "$pkg" "$rollback"
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/components"
          cp "$pkg" "$RUNNER_TEMP/release/SLAP-5-0.1.39.fwsc"
          cp device/build/slap-5.bin device/build/loader/ota.bin "$RUNNER_TEMP/components/"
          git archive --format=tar.gz --prefix=SLAP-5/ "$CHECKPOINT" > "$RUNNER_TEMP/components/source.tar.gz"
          cp START-HERE.md "$RUNNER_TEMP/components/"
          cp "$RUNNER_TEMP/release/SLAP-5-0.1.39.fwsc" "$RUNNER_TEMP/components/"
          (cd "$RUNNER_TEMP/components" && sha256sum SLAP-5-0.1.39.fwsc slap-5.bin ota.bin source.tar.gz START-HERE.md > SHA256SUMS && sha256sum -c SHA256SUMS)
          tar -C "$RUNNER_TEMP/components" -czf "$RUNNER_TEMP/release/SLAP-5-0.1.39-engineering-backup.tar.gz" .
          cd "$RUNNER_TEMP/release"
          sha256sum SLAP-5-0.1.39.fwsc SLAP-5-0.1.39-engineering-backup.tar.gz | tee SHA256SUMS-0.1.39
      - uses: actions/upload-artifact@v4
        with:
          name: SLAP-5-0.1.39-qualified-hardware-testing
          path: ${{ runner.temp }}/release
          if-no-files-found: error
      - name: Publish the qualified experimental package
        run: |
          cd "$RUNNER_TEMP/release"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$CHECKPOINT" --prerelease --latest=false \
            --title 'SLAP-5 v0.1.39 — Experimental FM-1 Hardware Testing' \
            --notes 'Experimental FM-1 testing. Adds bounded recovery for late voice jobs, idle dry-lane mixer bypass, and the LOOPER layout with a fixed palette. Firmware identity FM-1_75000139. Hardware chord-load acceptance remains pending. Native package audit, interrupted app-only update and v0.1.31 rollback simulation passed. Use the experimental browser installer on a supported updater source or use M-Flasher with the compatible 1 MiB 0x856014 flash, chip key 0x980F and V15-style application layout.' \
            SLAP-5-0.1.39.fwsc SLAP-5-0.1.39-engineering-backup.tar.gz SHA256SUMS-0.1.39
          mkdir downloaded
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          (cd downloaded && sha256sum -c SHA256SUMS-0.1.39)
          cmp SHA256SUMS-0.1.39 downloaded/SHA256SUMS-0.1.39
      - name: Stage the versioned direct browser installer
        run: |
          git fetch --no-tags origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/pages39" FETCH_HEAD
          cd "$RUNNER_TEMP/pages39"
          cp "$RUNNER_TEMP/release/SLAP-5-0.1.39.fwsc" "$RUNNER_TEMP/release/SHA256SUMS-0.1.39" .
          python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          package = Path("SLAP-5-0.1.39.fwsc").read_bytes()
          manifest = dict(version="0.1.39", product="FM-1_75000139",
                          sha256=sha256(package).hexdigest(), bytes=len(package),
                          sources=["FM-1_75000131", "FM-1_75000137", "FM-1_75000138"])
          Path("release-testing-0.1.39.json").write_text(json.dumps(manifest, indent=2) + "\n")
          js = Path("flash-0.1.31.js").read_text()
          Path("flash-0.1.39.js").write_text(js.replace("release-testing-0.1.31.json", "release-testing-0.1.39.json"))
          html = Path("flash-testing-0.1.31.html").read_text()
          html = html.replace("0.1.31", "0.1.39").replace("75000131", "75000139")
          html = html.replace("nexus-0.1.39/", "nexus-0.1.31/")
          html = html.replace('href="hardware-test-0.1.39.html"', 'href="https://github.com/CodingSlapfu/SLAP-5/releases/tag/v0.1.39-hardware-testing"')
          html = html.replace("running firmware 0.1.30 (FM-1_75000130)", "running SLAP-5 v0.1.31, v0.1.37, or v0.1.38")
          html = html.replace("flash-testing-0.1.30.html", "flash-testing-0.1.31.html").replace("Previous 0.1.30 installer", "Previous v0.1.31 installer")
          html = html.replace("SLAP-5-0.1.30.fwsc", "SLAP-5-0.1.31.fwsc").replace("0.1.30 firmware", "v0.1.31 firmware")
          Path("flash-testing-0.1.39.html").write_text(html)
          PY
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {validateRelease, verifyPackage} from './flash-release.mjs';
          const release = validateRelease(JSON.parse(fs.readFileSync('release-testing-0.1.39.json')));
          await verifyPackage(release, fs.readFileSync(release.file));
          JS
          git add flash-testing-0.1.39.html flash-0.1.39.js release-testing-0.1.39.json SLAP-5-0.1.39.fwsc SHA256SUMS-0.1.39
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m 'Stage verified v0.1.39 experimental browser installer'
          git push origin HEAD:refs/heads/gh-pages
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo 'Pages build request did not succeed; verify deployment separately.'
