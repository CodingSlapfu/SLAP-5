name: Publish SLAP-5 0.1.29 experimental hardware test
on:
  push:
    branches: [slap-5-red-alert-dsp]
    paths: ['.github/workflows/engineering-release-0129-hardware-testing.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: slap-5-0.1.29-hardware-testing
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact package and publish prerelease
        run: |
          set -euo pipefail
          source=2df799cfa0320bf3c6de97777b41b7b86fe642c3
          pages=1f515532aec24d466a980850c31a6ef771e03239
          test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/44964343882 --jq '.head_sha + ":" + .conclusion')" = "$source:success"
          git fetch --no-tags origin "$source" "$pages"
          git diff --exit-code "$source" HEAD -- device vendor tools
          stage="$RUNNER_TEMP/slap29"
          mkdir "$stage"
          for f in SLAP-5-0.1.29.fwsc SHA256SUMS-0.1.29 release-testing-0.1.29.json; do
            git show "$pages:$f" > "$stage/$f"
          done
          echo "52aa1473d14caea60f0f83245f612579bdb6f05085bb68aea1e39f785c24d745  $stage/SLAP-5-0.1.29.fwsc" | sha256sum -c
          tag=v0.1.29-hardware-testing
          gh release create "$tag" --target "$source" --draft --prerelease --latest=false \
            --title 'SLAP-5 v0.1.29 — EXPERIMENTAL FM-1 HARDWARE TESTING' \
            --notes-file evidence/release-0.1.29-hardware-testing.md "$stage/"*
          mkdir "$stage/verify"
          gh release download "$tag" --dir "$stage/verify"
          cmp "$stage/SLAP-5-0.1.29.fwsc" "$stage/verify/SLAP-5-0.1.29.fwsc"
          cmp "$stage/release-testing-0.1.29.json" "$stage/verify/release-testing-0.1.29.json"
          gh release edit "$tag" --draft=false --prerelease --latest=false
