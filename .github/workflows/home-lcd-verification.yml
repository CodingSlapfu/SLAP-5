name: SLAP-5 HOME LCD verification
on:
  push:
    branches: [slap-5-environment-recovery]
    paths: [.github/workflows/home-lcd-verification.yml, device/app.c, device/visuals.h, 'device/tests/**']
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile and compare HOME pixels and transfer sizes
        run: |
          python3 -m venv "$RUNNER_TEMP/slap-python"
          source "$RUNNER_TEMP/slap-python/bin/activate"
          pip install Pillow==11.3.0 fonttools==4.59.2
          git worktree add --detach "$RUNNER_TEMP/lcd-baseline" 8d68d757a39acb71f3d73fe491f86f33b6a653ac
          for source in "$RUNNER_TEMP/lcd-baseline" "$GITHUB_WORKSPACE"; do
            (
              cd "$source"
              python3 - <<'PY'
          from pathlib import Path
          p = Path("vendor/fm1-base/host/plat_host.c")
          s = p.read_text()
          assert s.count("static uint32_t blits;") == s.count("    blits++;") == 1
          s = s.replace("static uint32_t blits;", "static uint32_t blits, meter_blits;\nstatic unsigned long long blit_pixels;")
          s = s.replace("    blits++;", "    blits++;\n    blit_pixels += w * h;\n    if (w == 8 && h == 34) ++meter_blits;")
          mark = '    printf("host: %u ms simulated'
          assert s.count(mark) == 1
          s = s.replace(mark, '    printf("LCD_PIXELS %llu METER_BLITS %u\\n", blit_pixels, meter_blits);\n' + mark)
          p.write_text(s)
          PY
              python3 vendor/fm1-base/tools/build.py device --host
            )
          done
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          sources = [Path(os.environ["RUNNER_TEMP"]) / "lcd-baseline", Path.cwd()]
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              commands = ["wait 6100", "expect page 0", "expect playing 0"]
              for index in range(30):
                  channel = index % 5
                  pitch = 36 if channel == 4 else 55 + index % 9
                  commands += [f"midi {0x90 | channel:02x} {pitch:02x} 64", "wait 145",
                               f"shot on-{index}.png",
                               f"midi {0x80 | channel:02x} {pitch:02x} 00", "wait 161",
                               f"shot off-{index}.png"]
              fixture = root / "meters.txt"
              fixture.write_text("\n".join(commands) + "\n")
              pixels = []
              for label, source in zip(("baseline", "candidate"), sources):
                  output = root / label
                  output.mkdir()
                  host = source / "device/build/host/slap-5_host"
                  result = subprocess.check_output([host, fixture, output], text=True)
                  match = re.search(r"LCD_PIXELS (\d+) METER_BLITS (\d+)", result)
                  assert match, result
                  total, meter = map(int, match.groups())
                  print(label, total, "RGB565 pixels;", meter, "meter-only transfers")
                  pixels.append(total)
                  assert (meter > 0) == (label == "candidate")
              images = sorted((root / "baseline").glob("*.png"))
              assert len(images) == 60
              for image in images:
                  from PIL import Image
                  with Image.open(root / "candidate" / image.name) as capture:
                      assert capture.size == (240, 240), image.name
                      # The bottom row of every lane is painted, including the gutter.
                      for y in (67, 101, 135, 169, 203):
                          assert capture.convert("RGB").getpixel((2, y)) != (0, 0, 0), (image.name, y)
              assert pixels[1] < pixels[0]
              print("60 full-height LOOPER lane captures. Pixels avoided:", pixels[0] - pixels[1])
              gallery = Path(os.environ["RUNNER_TEMP"]) / "looper-captures"
              gallery.mkdir()
              for label in ("baseline", "candidate"):
                  with Image.open(root / label / "on-0.png") as capture:
                      capture.save(gallery / (label + "-240.png"))
                      capture.resize((960, 960), Image.Resampling.NEAREST).save(gallery / (label + "-960.png"))
              fixture.write_text("wait 6100\ntap GLO\nturn ALGO 5\nwait 2200\nshot display.png\ntap HOME\ntap GLO\nturn ALGO 5\nwait 500\nshot reenter.png\n")
              transfer_counts = []
              dirs = []
              for label, source in zip(("baseline", "candidate"), sources):
                  output = root / (label + "-display")
                  output.mkdir()
                  dirs.append(output)
                  host = source / "device/build/host/slap-5_host"
                  result = subprocess.check_output([host, fixture, output], text=True)
                  transfer_counts.append(int(re.search(r"LCD_PIXELS (\d+)", result).group(1)))
              # Compare each build to itself on re-entry.
              for output in dirs:
                  assert (output / "display.png").read_bytes() == (output / "reenter.png").read_bytes()
              assert transfer_counts[1] < transfer_counts[0]
              print("DISPLAY settled and re-entry pixels:", transfer_counts)
          PY
      - name: Run candidate host, MIDI and dual-core regressions
        run: |
          source "$RUNNER_TEMP/slap-python/bin/activate"
          host="$PWD/device/build/host/slap-5_host"
          for fixture in device/tests/*.txt; do
            out="$(mktemp -d)"
            "$host" "$fixture" "$out"
            if [ "$fixture" = device/tests/knob-style.txt ]; then
              cp "$out"/knob-*.png "$RUNNER_TEMP/looper-captures/"
            fi
            if [ "$fixture" = device/tests/expression.txt ]; then
              cp "$out"/sound-lab-expression.png "$out"/expression-reloaded.png "$RUNNER_TEMP/looper-captures/"
            fi
          done
          python3 device/tests/midi-clock-stress.py "$host"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          gallery = Path(os.environ["RUNNER_TEMP"]) / "looper-captures"
          knobs = sorted(gallery.glob("knob-*.png"))
          assert len(knobs) == 4, knobs
          footers = set()
          for screenshot in knobs:
              with Image.open(screenshot) as image:
                  assert image.size == (240, 240), screenshot
                  footers.add(image.crop((0, 196, 240, 240)).tobytes())
                  image.resize((960, 960), Image.Resampling.NEAREST).save(
                      screenshot.with_stem(screenshot.stem + "-960"))
          assert len(footers) == 4, "All four styles must change the MIXER footer"
          PY
          sh device/tests/dual-core.sh
          python3 device/tests/dense-recording.py --bpm 155 --extreme --soak-ms 10000
          python3 device/tests/sound-graph-audio.py "$host"
      - uses: actions/upload-artifact@v4
        with:
          name: looper-and-expression-framebuffer
          path: ${{ runner.temp }}/looper-captures
      - name: Compile candidate with verified native inputs
        run: |
          source "$RUNNER_TEMP/slap-python/bin/activate"
          bash vendor/fm1-base/tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          export JIELI_TOOLCHAIN="$(realpath "$RUNNER_TEMP/jieli/toolchain")"
          test "$(basename "$JIELI_TOOLCHAIN")" = jieli-linux-toolchains-20260730.1
          # This candidate uses neither the vendor BLE nor Wi-Fi stack.
          grep -qx 'ble = false' device/fm1.toml
          ! grep -Eq '^wifi[[:space:]]*=[[:space:]]*true' device/fm1.toml
          export AC79_SDK="$RUNNER_TEMP/ac79-packaging"
          tools_dir="$AC79_SDK/cpu/wl82/tools"
          sdk_raw=https://raw.githubusercontent.com/amitv87/fw-AC79_AIoT_SDK/d179b4484759423312073f5fbb232501aa491047/cpu/wl82/tools
          while read -r digest file; do
            mkdir -p "$(dirname "$tools_dir/$file")"
            curl -fsSL --retry 2 --max-time 30 "$sdk_raw/$file" -o "$tools_dir/$file"
            printf '%s  %s\n' "$digest" "$tools_dir/$file" | sha256sum -c -
          done < evidence/sdk.sha256
          git restore vendor/fm1-base/host/plat_host.c
          sh device/build-native.sh
          printf 'AC79_SDK=%s\n' "$AC79_SDK" >> "$GITHUB_ENV"
      - name: Audit the candidate and simulate interrupted OTA and v0.1.31 rollback
        run: |
          source "$RUNNER_TEMP/slap-python/bin/activate"
          python3 tools/audit-package.py --sdk "$AC79_SDK" --app device/build/slap-5.bin \
            --loader device/build/loader/ota.bin --package device/build/slap-5.fwsc --identity FM-1_7500
          backup="$RUNNER_TEMP/SLAP-5-0.1.41-engineering-backup.tar.gz"
          previous="$RUNNER_TEMP/SLAP-5-0.1.41.fwsc"
          release=https://github.com/CodingSlapfu/SLAP-5/releases/download/v0.1.41-hardware-testing
          curl -fsSL --retry 3 -o "$backup" "$release/SLAP-5-0.1.41-engineering-backup.tar.gz"
          curl -fsSL --retry 3 -o "$previous" "$release/SLAP-5-0.1.41.fwsc"
          printf '%s  %s\n' 1935bbfa06f8ce7ffc0b0d3cefdf581a035db4c190d2c2dc8fe184ccb97865fe "$backup" | sha256sum -c -
          printf '%s  %s\n' 1511fbf8916ebc0e91c8d2981df813de96dfd8fb723077c7e809c509f4d8aebd "$previous" | sha256sum -c -
          tar -tzf "$backup" > "$RUNNER_TEMP/v041-backup-files.txt"
          latest_release=https://github.com/CodingSlapfu/SLAP-5/releases/download/v0.1.42-hardware-testing
          for entry in '7a2f7730a99b144c2390d6e42682082358e3c9921efe031cb777de19ac4ab1cc SLAP-5-0.1.42.fwsc' 'd9762dcca9156eb55bc3000eaa21a2181b4bb2f1b39c019621b6c1bde0dba127 SLAP-5-0.1.42-engineering-backup.tar.gz'; do
            read -r digest name <<< "$entry"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name" "$latest_release/$name"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/$name" | sha256sum -c -
          done
          latest_release=https://github.com/CodingSlapfu/SLAP-5/releases/download/v0.1.43-hardware-testing
          for entry in '387a7a96b30e6234411a17eb8c6a7deec11c3b3e7c335f4ef1755ec8170f774f SLAP-5-0.1.43.fwsc' '77ab14a61502b7eac335d7dece0c8499662c3352bc67edf5b7cae63581cdcd80 SLAP-5-0.1.43-engineering-backup.tar.gz'; do
            read -r digest name <<< "$entry"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name" "$latest_release/$name"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/$name" | sha256sum -c -
          done
          rollback="$RUNNER_TEMP/SLAP-5-0.1.31.fwsc"
          curl -fsSL --retry 3 -o "$rollback" \
            https://github.com/CodingSlapfu/SLAP-5/releases/download/v0.1.31-hardware-testing/SLAP-5-0.1.31.fwsc
          printf '%s  %s\n' 36676ae153435f065c99c2106bdccf43917f7cd57f65fb702e0144d0055ef8be "$rollback" | sha256sum -c -
          cc -O2 -o "$RUNNER_TEMP/ldr-test" vendor/fm1-base/tests/ldr_test.c
          "$RUNNER_TEMP/ldr-test" "$rollback" device/build/slap-5.fwsc --interrupt
          "$RUNNER_TEMP/ldr-test" device/build/slap-5.fwsc "$rollback"
          cd device/build
          sha256sum slap-5.fwsc slap-5.bin loader/ota.bin | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: slap-5-engineering-checkpoint-unpublished
          retention-days: 30
          if-no-files-found: error
          path: |
            device/build/slap-5.fwsc
            device/build/slap-5.bin
            device/build/loader/ota.bin
            device/build/SHA256SUMS
