name: Publish SLAP-5 0.1.11 engineering candidate
on:
  workflow_run:
    workflows: ["SLAP STUDIO browser tests"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: slap-5-0.1.11-release
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify release payload
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/slap-release"
          tar -xJf engineering/SLAP-5-0.1.11-assets.tar.xz -C "${RUNNER_TEMP}/slap-release"
          cd "${RUNNER_TEMP}/slap-release"
          cmp SHA256SUMS "${GITHUB_WORKSPACE}/evidence/build-0.1.11.sha256"
          sha256sum -c SHA256SUMS
      - name: Publish exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=v0.1.11-testing
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "The release already exists. Refusing to replace it." >&2
            exit 0
          fi
          gh release create "$tag" --target "${{ github.event.workflow_run.head_sha }}" --prerelease \
            --title "SLAP-5 0.1.11 engineering TESTING" \
            --notes-file evidence/release-0.1.11.md \
            "${RUNNER_TEMP}/slap-release/SLAP-5-0.1.11.fwsc" \
            "${RUNNER_TEMP}/slap-release/SLAP-5-0.1.11-application.bin" \
            "${RUNNER_TEMP}/slap-release/SLAP-5-0.1.11-loader.bin" \
            "${RUNNER_TEMP}/slap-release/SHA256SUMS"
