<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLAP STUDIO</title>
  <link rel="stylesheet" href="studio.css">
  <link rel="stylesheet" href="fonts/slap-block.css">
</head>
<body>
  <header>
    <a class="brand" href="studio.html">SLAP<span> STUDIO</span></a>
    <a href="emulator/">FM-1 Emulator</a>
  </header>
  <main>
    <section aria-label="Transport" class="toolbar">
      <button id="start">Enable audio</button>
      <button id="play" disabled>Play</button>
      <label>BPM<input id="bpm" type="number" min="40" max="240" value="112"></label>
      <label>Swing<input id="swing" type="number" min="0" max="70" value="0"></label>
      <label>Metronome<select id="metro"><option value="0">Off</option><option value="1">Rec</option><option value="2">On</option></select></label>
      <button id="undo" disabled>Undo</button>
      <button id="redo" disabled>Redo</button>
      <button id="export" disabled>Export</button>
      <label class="import">Import<input id="import" type="file" accept=".json,application/json" disabled></label>
    </section>
    <section class="toolbar" aria-label="Record a take">
      <label>Bars<select id="take-bars"><option>1</option><option>2</option><option>4</option><option>8</option><option>16</option><option>32</option></select></label>
      <label>Start<select id="take-start"><option value="0">First note</option><option value="1">Count-in</option></select></label>
      <label>Quantize<select id="take-quant"><option value="0">Off</option><option value="1">25% · 1/8</option><option value="2">50% · 1/8</option><option value="3">75% · 1/8</option><option value="4">100% · 1/8</option><option value="5">25% · 1/16</option><option value="6" selected>50% · 1/16</option><option value="7">75% · 1/16</option><option value="8">100% · 1/16</option><option value="9">25% · 1/32</option><option value="10">50% · 1/32</option><option value="11">75% · 1/32</option><option value="12">100% · 1/32</option></select></label>
      <label>Mode<select id="take-mode"><option value="0">Overdub</option><option value="1">Replace</option></select></label>
      <button id="take" disabled>Record track</button><button id="quick-take" disabled>Quick REC</button><button id="use-midi" disabled>Enable MIDI</button>
      <output id="take-state" aria-live="polite"></output>
      <div id="take-keys" class="settings" aria-label="Performance keys"></div>
    </section>
    <nav id="tracks" aria-label="Tracks"></nav>
    <section class="editor" aria-label="Pattern editor">
      <div class="editor-head">
        <div><p id="track-number"></p><h1 id="title">Piano roll</h1></div>
        <div class="settings">
          <label>Patch<select id="patch" aria-label="Factory patch"></select></label>
          <label>Steps<input id="length" type="number" min="1" max="512"></label>
          <label>Pan<input id="pan" type="number" min="0" max="255"></label>
          <label>Level<input id="level" type="number" min="0" max="255"></label>
          <label>Mute<input id="mute" type="checkbox"></label>
        </div>
      </div>
      <div class="settings">
        <label>Track FX<select id="fx-page">
          <option value="1">Filter</option><option value="2">Slicer</option><option value="3">Insert</option>
          <option value="4">Processor</option><option value="5">Reverb</option><option value="6">Delay</option>
          <option value="7">Chorus</option><option value="8">Drive</option>
        </select></label>
        <div id="fx-knobs" class="settings"></div>
      </div>
      <div id="generator" class="settings" hidden>
        <label>Style<select id="gen-style"></select></label>
        <label>Hit %<input id="gen-hit" type="number" min="0" max="100" value="70"></label>
        <label>Groove<input id="gen-groove" type="number" min="0" max="100" value="25"></label>
        <label>Variation<input id="gen-variation" type="number" min="0" max="100" value="40"></label>
        <button id="gen-apply" type="button">Generate drums</button>
      </div>
      <p id="hint">Enable audio to load the FM-1 sequencer and factory patches.</p>
      <div class="settings"><button id="prev-steps" disabled>Previous steps</button>
        <button id="next-steps" disabled>Next steps</button></div>
      <div id="view" tabindex="0" aria-label="Step grid"><canvas id="roll"></canvas></div>
      <div class="inspector">
        <output id="position">Select a step</output>
        <label>Velocity<input id="velocity" type="number" min="1" max="127" disabled></label>
        <label>Gate<input id="gate" type="number" min="1" max="255" disabled></label>
        <label>Hold ms<input id="hold-ms" type="number" min="0" max="190214" disabled></label>
        <label>Hit %<input id="prob" type="number" min="0" max="100" disabled></label>
        <label>Offset <input id="timing" type="number" min="0" max="15" disabled></label>
        <span id="drum-controls" hidden><label>Drum lane <select id="drum-lane"><option value="0">Kick</option><option value="1">Snare</option><option value="2">Hat</option><option value="3">Rim</option><option value="4">Clap</option><option value="5">Cymbal</option></select></label>
          <label>Mute <input id="drum-mute" type="checkbox"></label>
          <label>Solo <input id="drum-solo" type="checkbox"></label></span>
        <button id="clear" disabled>Delete note</button>
      </div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="studio.js"></script>
</body>
</html>
